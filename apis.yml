aid: appliedintuition
name: Applied Intuition
description: 'Applied Intuition builds physical AI software and systems for intelligent
  machines, helping customers develop, test, validate, deploy, and operate autonomy
  and vehicle intelligence across automotive, defense, trucking, mining, construction,
  and agriculture. Its product lines include a Self-Driving System (a unified autonomy
  stack for land, air, and sea), Vehicle OS (an operating system for intelligent machines),
  and Tools for Vehicle Intelligence covering simulation, validation, data, training,
  and evaluation workflows. The company operates as a private enterprise vendor and
  does not currently publish a public developer API or self-service portal; this profile
  captures its public identity, security posture, and machine-readable llms.txt.'
